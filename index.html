<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Backgammon Reserve</title>
<style>
  :root {
    --bg: #15110D; --surface: #201a13; --text: #F7EEDC; --secondary: #B9A88C;
    --brass: #C9A45C; --hairline: #3A2D22;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #faf6ee; --surface: #ffffff; --text: #2a2118; --secondary: #6b5d49;
             --brass: #8a6a2f; --hairline: #e0d5c2; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.65 Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
  .brand {
    font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 8px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif; font-weight: 600;
  }
  .brand a { color: inherit; text-decoration: none; }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 6px; font-weight: 600; }
  h2 { font-size: 22px; margin: 40px 0 12px; padding-top: 20px;
        border-top: 1px solid var(--hairline); font-weight: 600; }
  h3 { font-size: 18px; margin: 24px 0 8px; font-weight: 600; }
  a { color: var(--brass); }
  strong { color: var(--text); }
  blockquote {
    margin: 20px 0; padding: 14px 18px; background: var(--surface);
    border-left: 3px solid var(--brass); border-radius: 6px; color: var(--secondary);
  }
  blockquote p { margin: 0; }
  table { border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 15px; }
  th, td { border: 1px solid var(--hairline); padding: 8px 12px; text-align: left; }
  th { color: var(--brass); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  hr { border: 0; border-top: 1px solid var(--hairline); margin: 36px 0; }
  ul { padding-left: 24px; }
  li { margin: 6px 0; }
  em { color: var(--secondary); }
  footer { margin-top: 64px; color: var(--secondary); font-size: 14px; }
</style>
</head>
<body>
<main>
  <p class="brand"><a href="index.html">Backgammon Reserve</a></p>
  <h1>Backgammon Reserve</h1>
  <p><em>Fair dice. No coins. Pure backgammon.</em></p>
  <p>Legal documents for the Backgammon Reserve iOS app:</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="terms.html">Terms of Use</a></li>
  </ul>
  <p>Support: <a href="mailto:backgammonreserve@gmail.com">backgammonreserve@gmail.com</a></p>

  <footer>Questions? Email <a href="mailto:backgammonreserve@gmail.com">backgammonreserve@gmail.com</a>.</footer>
</main>
</body>
</html>
